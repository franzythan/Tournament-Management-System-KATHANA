name: Build KATHANA TMS v0.18 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify FINAL source ZIP
        run: |
          echo "21471eb065288f069beea8fa9634bc0c47f819f2d6a8d3dcd94e80517aa3f023  KATHANA_TMS_v0_18_FINAL_SOURCE.zip" | sha256sum -c -

      - name: Extract FINAL source
        run: |
          rm -rf android-project
          mkdir android-project
          unzip -q KATHANA_TMS_v0_18_FINAL_SOURCE.zip -d android-project

      - name: Build Debug APK
        working-directory: android-project
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          cp android-project/app/build/outputs/apk/debug/app-debug.apk KATHANA-TMS-v0.18.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KATHANA-TMS-v0.18
          path: KATHANA-TMS-v0.18.apk
          if-no-files-found: error
