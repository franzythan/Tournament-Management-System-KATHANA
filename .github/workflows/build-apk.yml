name: Build KATHANA TMS v0.9 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Extract KATHANA TMS v0.9
        run: |
          mkdir -p android-project
          unzip -q "KATHANA_TMS_v0_9_TEST_SOURCE.zip" -d android-project

      - name: Build APK
        working-directory: android-project
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp android-project/app/build/outputs/apk/debug/app-debug.apk KATHANA-TMS-v0.9.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KATHANA-TMS-v0.9
          path: KATHANA-TMS-v0.9.apk
          retention-days: 30
