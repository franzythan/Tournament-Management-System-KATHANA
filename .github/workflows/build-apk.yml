name: Build KATHANA TMS LB Label Fix APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify LB Round Label Correction source
        run: |
          echo "e0bbe561116d812463e133cb28a1899d46508038f7efc8cbb579086ad5e0e215  KATHANA_TMS_v0_18_LB_ROUND_LABEL_CORRECTION_SOURCE.zip" | sha256sum -c -

      - name: Extract corrected source
        run: |
          rm -rf android-project
          mkdir android-project
          unzip -q KATHANA_TMS_v0_18_LB_ROUND_LABEL_CORRECTION_SOURCE.zip -d android-project

      - name: Build APK
        working-directory: android-project
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          cp android-project/app/build/outputs/apk/debug/app-debug.apk KATHANA-TMS-v0.18-LB-LABEL-FIX.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KATHANA-TMS-v0.18-LB-LABEL-FIX
          path: KATHANA-TMS-v0.18-LB-LABEL-FIX.apk
          if-no-files-found: error
